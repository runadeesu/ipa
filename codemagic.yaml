workflows:
  ios-build:
    name: Moonlauncher iOS Build
    max_build_duration: 30
    instance_type: mac_mini_co
    triggering:
      events:
        - push
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build Xcode Archive
        script: |
          xcodebuild archive \
            -project Moonlauncher.xcodeproj \
            -scheme Moonlauncher \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $FCI_BUILD_DIR/build/Moonlauncher.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package to IPA
        script: |
          mkdir -p build/Payload
          cp -r build/Moonlauncher.xcarchive/Products/Applications/Moonlauncher.app build/Payload/
          cd build
          zip -r Moonlauncher.ipa Payload
    artifacts:
      - build/*.ipa
