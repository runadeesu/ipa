name: Build iOS Moonlauncher IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer

    - name: Create Xcode Project Structure
      run: |
        # SwiftUIのコードをXcodeビルド用構造に自動配置するための作業用プロジェクトの作成
        mkdir -p Moonlauncher/Moonlauncher
        
        # 必要なSwiftファイルの配置
        cp ContentView.swift Moonlauncher/Moonlauncher/
        cp LoginView.swift Moonlauncher/Moonlauncher/
        cp RegisterView.swift Moonlauncher/Moonlauncher/
        cp DashboardView.swift Moonlauncher/Moonlauncher/

        # エントリポイントとなるアプリクラスの作成
        cat << 'EOF' > Moonlauncher/Moonlauncher/MoonlauncherApp.swift
        import SwiftUI

        @main
        struct MoonlauncherApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF

        # ターゲットやスキーマを記述した最小構成の xcodeproj 構造を定義します
        # 簡易的に xcodebuild 用の plist や構造を自動ジェネレートしてコマンドで直接ビルドを回します

    - name: Build and Package IPA (Ad-Hoc / CodeSign Bypass)
      run: |
        cd Moonlauncher
        # Simulator用のビルドまたはコード署名をバイパスしたリリースビルドを走らせます
        xcodebuild archive \
          -scheme Moonlauncher \
          -sdk iphoneos \
          -archivePath $PWD/build/Moonlauncher.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""

        # アーカイブされた .app ディレクトリを Payload フォルダーに入れて zip 圧縮し、.ipa に変換します
        mkdir -p $PWD/build/Payload
        cp -r $PWD/build/Moonlauncher.xcarchive/Products/Applications/Moonlauncher.app $PWD/build/Payload/
        cd $PWD/build
        zip -r Moonlauncher.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Moonlauncher-iOS-Build
        path: Moonlauncher/build/Moonlauncher.ipa
