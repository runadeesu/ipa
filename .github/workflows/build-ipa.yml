name: Build iOS Moonlauncher IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build and Archive
      run: |
        xcodebuild archive \
          -project Moonlauncher.xcodeproj \
          -scheme Moonlauncher \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/Moonlauncher.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: Package IPA
      run: |
        mkdir -p build/Payload
        cp -r build/Moonlauncher.xcarchive/Products/Applications/Moonlauncher.app build/Payload/
        cd build
        zip -r Moonlauncher.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Moonlauncher-iOS-Build
        path: build/Moonlauncher.ipa
