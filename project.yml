name: Moonlauncher
options:
  bundleIdPrefix: com.runadeesu
targets:
  Moonlauncher:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "build_ipa_windows.bat"
          - "build_ipa.ps1"
          - "codemagic.yaml"
          - "index.html"
          - "README.md"
          - "Info.plist"
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.runadeesu.moonlauncher
        CFBundleName: Moonlauncher
        CFBundleExecutable: Moonlauncher
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      CODE_SIGNING_ALLOWED: false
      CODE_SIGNING_REQUIRED: false
      CODE_SIGN_IDENTITY: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
